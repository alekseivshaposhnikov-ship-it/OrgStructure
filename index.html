
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Org Structure Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.cdnfonts.com/css/tt-norms-pro" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>

  <body>
    <div class="sidebar">
      <div class="app-title">
        <h1>Организационная структура</h1>
        <button
          id="openChangelog"
          type="button"
          class="changelog-icon-button"
          aria-label="Открыть журнал обновлений"
          title="Что нового"
        >
          <span aria-hidden="true">ⓘ</span>
          <span id="changelogBadge" class="changelog-icon-button__badge hidden">NEW</span>
        </button>
      </div>

      <div class="employee-search">
        <input
          id="employeeSearch"
          type="text"
          class="employee-search__input"
          placeholder="Найти сотрудника по ФИО"
          autocomplete="off"
          aria-label="Найти сотрудника по ФИО"
        />
        <button
          id="searchClear"
          type="button"
          class="employee-search__clear"
          aria-label="Очистить поиск"
        >
          ×
        </button>
        <button
          id="searchReturn"
          type="button"
          class="employee-search__return hidden"
        ></button>
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <div class="controls">
        <button id="exportPdf">📄 Экспорт в PDF</button>

        <div class="expand-controls">
          <button id="expandAll" type="button" class="button-secondary">Развернуть всё</button>
          <button id="collapseAll" type="button" class="button-secondary">Свернуть всё</button>
        </div>

        <label class="vacancy-toggle">
          <input id="exportWithoutNames" type="checkbox" />
          Выгружать PDF без фамилий
        </label>

        <label class="vacancy-toggle">
          <input id="showVacancies" type="checkbox" />
          Показывать вакансии
        </label>

        <label class="vacancy-toggle">
          <input id="showLevels" type="checkbox" />
          Показывать уровни
        </label>

        <label class="design-switcher">
          <span>Дизайн карточек</span>
            <select id="cardDesign">
            <option value="classic">Текущий</option>
            <option value="grouped">Группировка по должности</option>
          </select>
        </label>

        <label class="design-switcher">
          <span>Ширина карточек</span>
          <div class="range-with-value">
            <input id="cardWidth" type="range" min="180" max="500" step="10" value="350" />
            <span id="cardWidthValue">350 px</span>
          </div>
        </label>
      </div>

      <div class="scenario-panel" id="scenarioPanel">
        <button
          id="scenarioPanelToggle"
          class="scenario-panel__toggle"
          type="button"
          aria-expanded="false"
        >
          <span id="scenarioPanelIcon">▶</span>
          <span>Сценарий моделирования</span>
        </button>

        <div id="scenarioPanelBody" class="scenario-panel__body">
        <label class="scenario-field">
          <span>Название сценария</span>
          <input id="scenarioName" type="text" />
        </label>

        <label class="scenario-field">
          <span>Режим отображения</span>
          <select id="viewMode">
            <option value="as-is">Текущая структура</option>
            <option value="to-be">Целевая структура</option>
            <option value="changes">Изменения</option>
          </select>
        </label>

        <div id="scenarioStats" class="scenario-stats"></div>

        <div class="scenario-actions">
          <button id="compareScenario" type="button">Сравнить</button>
          <button id="resetScenario" type="button" class="button-secondary">Сбросить</button>
        </div>
        </div>
      </div>

      <div id="tree-container" class="tree-container"></div>
    </div>

    <div id="chartPanel">
      <div id="orgChart"></div>
    </div>

    <button id="changesToggle" type="button" class="changes-toggle hidden">
      Изменения · 0
    </button>

    <aside id="changesPanel" class="changes-panel hidden">
      <div class="changes-panel__header">
        <h2>Изменения</h2>
        <span id="changesCount">0</span>
        <button
          id="changesPanelClose"
          type="button"
          class="changes-panel__close"
          aria-label="Закрыть панель изменений"
        >
          ×
        </button>
      </div>
      <div id="changesList" class="changes-list"></div>
    </aside>

    <div id="employeeModal" class="employee-modal hidden">
      <div class="employee-modal__backdrop"></div>
      <div class="employee-modal__card">
        <button id="closeEmployeeModal" class="employee-modal__close">×</button>
        <div id="employeeDetails"></div>
      </div>
    </div>

    <div id="scenarioModal" class="scenario-modal hidden">
      <div class="scenario-modal__backdrop"></div>
      <div class="scenario-modal__card">
        <button id="closeScenarioModal" class="scenario-modal__close">×</button>
        <h2 id="scenarioModalTitle"></h2>
        <form id="scenarioForm"></form>
      </div>
    </div>

    <div id="compareModal" class="scenario-modal hidden">
      <div class="scenario-modal__backdrop" data-close-compare></div>
      <div class="scenario-modal__card scenario-modal__card--wide">
        <button id="closeCompareModal" class="scenario-modal__close">×</button>
        <h2>Сравнение AS IS / TO BE</h2>
        <div id="compareContent"></div>
      </div>
    </div>

    <div id="changelogModal" class="scenario-modal hidden">
      <div class="scenario-modal__backdrop" data-close-changelog></div>
      <div class="scenario-modal__card scenario-modal__card--wide changelog-modal__card">
        <button id="closeChangelogModal" class="scenario-modal__close">×</button>
        <div class="changelog-modal__header">
          <div>
            <div class="changelog-modal__eyebrow">Журнал обновлений</div>
            <h2>Что нового</h2>
          </div>
          <div id="changelogLatestVersion" class="changelog-modal__version"></div>
        </div>
        <div id="changelogContent" class="changelog-content"></div>
      </div>
    </div>
  </body>
</html>
